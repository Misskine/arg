<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Entrée et Corridor infini</title>

    <style>
        /* ── RESET ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: #0a0a0a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── WRAPPER SCALE ──────────────────────────────────────────
           On scale ce wrapper entier. Les coordonnées internes (px
           natifs pixel-art) ne changent jamais. Le JS calcule --scale
           pour que le jeu remplisse l'écran au mieux (max ×8).
           ─────────────────────────────────────────────────────────── */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transform: scale(var(--scale, 4));
            transform-origin: center center;
        }

        /* ── ZONE DE JEU (dimensions pixel-art fixes) ── */
        #game {
            position: relative;
            width: 256px;
            height: 79px;
            border: 1px solid #333;
            overflow: hidden;
            background: #000;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            image-rendering: pixelated;
        }

        /* ── COULOIR ── */
        #corridor {
            position: absolute;
            top: 0; left: 0;
            display: flex;
            width: 768px;
            height: 79px;
            will-change: transform;
        }

        .mur-parent {
            width: 256px;
            height: 79px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        img { image-rendering: pixelated; }

        /* ── TILES ── */
        .tile-mur      { position:absolute; top:0;    width:16px; height:47px; object-fit:cover; }
        .tile-sol-row1 { position:absolute; top:47px; width:16px; height:16px; object-fit:cover; }
        .tile-sol-row2 { position:absolute; top:63px; width:16px; height:16px; object-fit:cover; }

        /* ── PÉNOMBRE ── */
        #darkness {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(
                ellipse 100px 80px at var(--light-x, 126px) 40px,
                rgba(0,0,0,0)   0%,
                rgba(0,0,0,0.3) 40%,
                rgba(0,0,0,0.7) 70%,
                rgba(0,0,0,0.9) 100%
            );
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.3s ease;
        }

        /* ── PERSONNAGE ── */
        #player {
            position: absolute;
            bottom: 0; left: 120px;
            width: 12px; height: 20px;
            background-image: url('sprite/cat.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            will-change: left;
        }
        @keyframes walk {
            0%, 100% { background-image: url('sprite/catm1.png'); }
            50%       { background-image: url('sprite/catm2.png'); }
        }
        #player.walking { animation: walk 0.4s steps(1) infinite; }

        /* ── CORBEAU ── */
        #crow {
            position: absolute;
            bottom: 0; left: -200px;
            width: 100px; height: 50px;
            background-image: url('sprite/crow.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 9;
            will-change: left;
        }
        @keyframes crowWalk {
            0%, 100% { background-image: url('sprite/crow_walk.png'); }
            50%       { background-image: url('sprite/crow_walking.png'); }
        }
        #crow.walking { animation: crowWalk 0.4s steps(1) infinite; }

        /* ── INDICATEUR ── */
        #entrance-sign {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            border-radius: 3px;
            z-index: 20;
            pointer-events: none;
            transition: background 0.3s;
        }

        /* ── MEUBLES ENTRÉE ── */
        .fenetre-p-icon  { position:absolute; top:11px; left:4px;   width:12px; height:35px; object-fit:cover; }
        .bibli-icon      { position:absolute; top:11px; left:49px;  width:18px; height:44px; object-fit:cover; }
        .tableau-icon    { position:absolute; top:19px; left:25px;  width:16px; height:16px; object-fit:cover; }
        .table-icon      { position:absolute; top:37px; left:18px;  width:30px; height:17px; object-fit:cover; }
        .table-b-icon    { position:absolute; top:38px; left:160px; width:21px; height:17px; object-fit:cover; }
        .fenetre-r-icon  { position:absolute; top:13px; left:133px; width:23px; height:18px; object-fit:cover; }
        .tapis-porte-icon{ position:absolute; top:49px; left:0px;   width:16px; height:27px; object-fit:cover; }
        .tapis-canap-icon{ position:absolute; top:46px; left:126px; width:36px; height:21px; object-fit:contain; }
        .canape-icon     { position:absolute; top:34px; left:128px; width:32px; height:21px; object-fit:cover; }

        /* ── CONTRÔLES MOBILES ──
           Taille en px natifs → scalés avec le wrapper.
           Affichés uniquement sur écrans tactiles.       */
        #mobile-controls {
            display: none;
            justify-content: center;
            gap: 8px;
        }
        #mobile-controls button {
            width: 40px; height: 20px;
            font-size: 9px;
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 3px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            line-height: 1;
        }
        #mobile-controls button:active { background: rgba(255,255,255,0.3); }

        @media (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game">
        <div id="corridor"></div>
        <div id="crow"></div>
        <div id="player"></div>
        <div id="darkness"></div>
        <div id="entrance-sign">ENTRÉE</div>
    </div>

    <div id="mobile-controls">
        <button id="btn-left"  aria-label="Gauche">◀</button>
        <button id="btn-right" aria-label="Droite">▶</button>
    </div>
</div>

<script>
/* ─────────────────────────────────────────────
   SCALE RESPONSIVE
   Calcule le meilleur scale entier (pixel-art
   net) ou fractionnaire pour remplir l'écran.
   Max ×8, recalculé à chaque resize.
   ───────────────────────────────────────────── */
const GAME_W   = 256;
const GAME_H   = 79;
const MAX_SCALE = 8;
const MARGIN    = 24; // px de marge de confort (coordonnées écran)

function updateScale() {
    const hasTouch   = window.matchMedia('(pointer: coarse)').matches;
    const btnReserve = hasTouch ? 30 : 0; // hauteur boutons (px natifs × scale → on anticipe)
    const vw = window.innerWidth  - MARGIN * 2;
    const vh = window.innerHeight - MARGIN * 2;

    // Scale max pour tenir dans l'écran (boutons compris)
    const scaleX = vw / GAME_W;
    const scaleY = vh / (GAME_H + (hasTouch ? 30 : 0));
    const scale  = Math.min(scaleX, scaleY, MAX_SCALE);

    document.getElementById('game-wrapper').style.setProperty('--scale', scale.toFixed(4));
}

updateScale();
window.addEventListener('resize', updateScale);
// Sur mobile l'URL bar apparaît/disparaît → visualViewport plus fiable
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateScale);
}


/* ─────────────────────────────────────────────
   CONSTRUCTION DES TILES EN JS
   ───────────────────────────────────────────── */
function buildSection(withFurniture) {
    const div = document.createElement('div');
    div.className = 'mur-parent';

    for (let i = 0; i < 16; i++) {
        const img = document.createElement('img');
        img.className = 'tile-mur';
        img.style.left = (i * 16) + 'px';
        img.src = 'furniture/mur.png'; img.alt = '';
        div.appendChild(img);
    }
    for (let i = 0; i < 16; i++) {
        const img = document.createElement('img');
        img.className = 'tile-sol-row1';
        img.style.left = (i * 16) + 'px';
        img.src = 'furniture/sol.png'; img.alt = '';
        div.appendChild(img);
    }
    for (let i = 0; i < 16; i++) {
        const img = document.createElement('img');
        img.className = 'tile-sol-row2';
        img.style.left = (i * 16) + 'px';
        img.src = 'furniture/sol.png'; img.alt = '';
        div.appendChild(img);
    }

    if (withFurniture) {
        const furniture = [
            { cls: 'fenetre-p-icon',   src: 'furniture/fenetre_p.png'  },
            { cls: 'bibli-icon',       src: 'furniture/bibli.png'      },
            { cls: 'tableau-icon',     src: 'furniture/tableau.png'    },
            { cls: 'table-icon',       src: 'furniture/table.png'      },
            { cls: 'table-b-icon',     src: 'furniture/table-b.png'    },
            { cls: 'fenetre-r-icon',   src: 'furniture/fenetre_r.png'  },
            { cls: 'tapis-porte-icon', src: 'furniture/tapis_porte.png'},
            { cls: 'tapis-canap-icon', src: 'furniture/tapis_canap.png'},
            { cls: 'canape-icon',      src: 'furniture/canape.png'     },
        ];
        for (const f of furniture) {
            const img = document.createElement('img');
            img.className = f.cls;
            img.src = f.src; img.alt = '';
            div.appendChild(img);
        }
    }
    return div;
}

(function buildCorridor() {
    const c = document.getElementById('corridor');
    c.appendChild(buildSection(true));   // section 0 : entrée avec meubles
    c.appendChild(buildSection(false));  // section 1 : couloir
    c.appendChild(buildSection(false));  // section 2 : couloir
})();


/* ─────────────────────────────────────────────
   ÉTAT DU JEU
   ───────────────────────────────────────────── */
const player       = document.getElementById('player');
const crow         = document.getElementById('crow');
const corridor     = document.getElementById('corridor');
const game         = document.getElementById('game');
const darkness     = document.getElementById('darkness');
const entranceSign = document.getElementById('entrance-sign');

let playerX         = 120;
let crowX           = -300;
let corridorX       = 0;      // 0 → entrée visible au départ
let totalDistance   = 0;
let isInCorridor    = false;
let hasLeftEntrance = false;

const SPEED         = 3;
const CROW_SPEED    = 1;
const TILE_WIDTH    = 256;
const CROW_DISTANCE = 150;

const keys = { left: false, right: false };


/* ─────────────────────────────────────────────
   BOUCLE PRINCIPALE — requestAnimationFrame
   ───────────────────────────────────────────── */
let lastTime = 0;

function gameLoop(ts) {
    const dt = Math.min((ts - lastTime) / 16.67, 3);
    lastTime = ts;

    let moved = false;

    if (keys.left) {
        playerX    = Math.max(0, playerX - SPEED * dt);
        corridorX += SPEED * dt;
        moved = true;
    }
    if (keys.right) {
        playerX       = Math.min(game.clientWidth - player.clientWidth, playerX + SPEED * dt);
        corridorX    -= SPEED * dt;
        totalDistance += SPEED * dt;
        moved = true;
    }

    // Corbeau autonome
    const dist = playerX - crowX;
    if (Math.abs(dist) > CROW_DISTANCE) {
        crowX += CROW_SPEED * (dist > 0 ? 1 : -1) * dt;
    }

    // Clamp : impossible de reculer derrière l'entrée
    if (corridorX > 0) corridorX = 0;

    // Wrap infini (seulement après avoir quitté l'entrée)
    if (corridorX < -TILE_WIDTH) hasLeftEntrance = true;
    if (hasLeftEntrance && corridorX <= -TILE_WIDTH * 2) corridorX += TILE_WIDTH;

    // Animations marche
    player.classList.toggle('walking', moved);
    crow.classList.toggle('walking', moved);

    // Applique les positions
    player.style.left        = playerX + 'px';
    crow.style.left          = crowX   + 'px';
    corridor.style.transform = `translateX(${corridorX}px)`;

    updateDarkness();
    checkEntrance();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(gameLoop); });


/* ─────────────────────────────────────────────
   PÉNOMBRE
   ───────────────────────────────────────────── */
function updateDarkness() {
    darkness.style.opacity = Math.min(totalDistance / 1000, 1);
    darkness.style.setProperty('--light-x', (playerX + 6) + 'px');
}


/* ─────────────────────────────────────────────
   INDICATEUR ENTRÉE / COULOIR
   ───────────────────────────────────────────── */
function checkEntrance() {
    const inCorridor = corridorX < -10;
    if (inCorridor === isInCorridor) return;
    isInCorridor = inCorridor;
    entranceSign.textContent      = inCorridor ? 'COULOIR INFINI' : 'ENTRÉE';
    entranceSign.style.opacity    = inCorridor ? '0.5' : '1';
    entranceSign.style.background = inCorridor ? 'rgba(100,0,0,0.5)' : 'rgba(0,0,0,0.5)';
}


/* ─────────────────────────────────────────────
   CLAVIER
   ───────────────────────────────────────────── */
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); keys.left  = true; }
    if (e.key === 'ArrowRight') { e.preventDefault(); keys.right = true; }
});
document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft')  keys.left  = false;
    if (e.key === 'ArrowRight') keys.right = false;
});


/* ─────────────────────────────────────────────
   CONTRÔLES MOBILES
   ───────────────────────────────────────────── */
function bindBtn(id, key) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('pointerdown',   e => { e.preventDefault(); keys[key] = true;  });
    btn.addEventListener('pointerup',     () => { keys[key] = false; });
    btn.addEventListener('pointerleave',  () => { keys[key] = false; });
    btn.addEventListener('pointercancel', () => { keys[key] = false; });
}
bindBtn('btn-left',  'left');
bindBtn('btn-right', 'right');

document.addEventListener('click', () => document.body.focus());
</script>
</body>
</html>
