    <style>
        /* ZONE DE JEU */
        #game {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 40px auto;
            border: 2px solid black;
            overflow: hidden;
            background: #000;
        }

        /* COULOIR INFINI AVEC ENTRÉE */
        #corridor {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            width: 768px; /* Augmenté pour 3 sections au lieu de 2 */
            height: 100px;
            transition: transform 0.1s ease;
        }

        .mur-parent {
            width: 256px;
            height: 100px;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Style spécial pour l'entrée (première section) */
        .mur-parent.entrance {
            background-color: #8B6B4D; /* Marron clair pour l'entrée */
        }

        img {
            image-rendering: pixelated;
        }

        /* EFFET DE PÉNOMBRE */
        #darkness {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 100px 80px at var(--light-x, 126px) 40px,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.3) 40%,
                rgba(0, 0, 0, 0.7) 70%,
                rgba(0, 0, 0, 0.9) 100%
            );
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.3s ease;
        }

        /* PERSONNAGE */
        #player {
            position: absolute;
            bottom: 0;
            left: 120px;
            width: 12px;
            height: 20px;
            background-image: url('sprite/cat.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            transition: left 0.1s linear;
        }

        @keyframes walk {
            0%, 100% { background-image: url('sprite/catm1.png'); }
            50% { background-image: url('sprite/catm2.png'); }
        }

        #player.walking {
            animation: walk 0.4s steps(1) infinite;
        }

        /* CORBEAU */
        #crow {
            position: absolute;
            bottom: 0;
            left: -200px;
            width: 100px;
            height: 50px;
            background-image: url('sprite/crow.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 9;
            transition: left 0.1s linear;
        }

        @keyframes crowWalk {
            0%, 100% { background-image: url('sprite/crow_walk.png'); }
            50% { background-image: url('sprite/crow_walking.png'); }
        }

        #crow.walking {
            animation: crowWalk 0.4s steps(1) infinite;
        }

        /* Indicateur d'entrée */

            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;

    <script>
        const player = document.getElementById("player");
        const crow = document.getElementById("crow");
        const corridor = document.getElementById("corridor");
        const game = document.getElementById("game");
        const darkness = document.getElementById("darkness");
        const entranceSign = document.getElementById("entrance-sign");

        let playerX = 120;
        let crowX = -300;
        let corridorX = 0;
        let totalDistance = 0;
        const speed = 3;
        const crowSpeed = 1;
        const tileWidth = 256;
        const distanceToMaintain = 150;
        let isInCorridor = false; // Pour savoir si on est dans le corridor

        function updateDarkness() {
            const darknessLevel = Math.min(totalDistance / 1000, 1);
            darkness.style.opacity = darknessLevel;
            
            // Centre la lumière sur le chat (position + moitié de la largeur du chat)
            const lightX = playerX + 6;
            darkness.style.setProperty('--light-x', `${lightX}px`);
        }

        function checkEntrance() {
            // Si on a dépassé l'entrée (quand corridorX est négatif)
            // La première section (entrée) fait 256px de large
            if (corridorX < -10 && !isInCorridor) {
                isInCorridor = true;
                entranceSign.style.opacity = '0.5';
                entranceSign.textContent = 'COULOIR INFINI';
            } else if (corridorX >= -10 && isInCorridor) {
                isInCorridor = false;
                entranceSign.style.opacity = '1';
                entranceSign.textContent = 'ENTRÉE';
            }
            
            // Change la couleur du signe selon l'endroit
            if (isInCorridor) {
                entranceSign.style.background = 'rgba(100,0,0,0.5)';
            } else {
                entranceSign.style.background = 'rgba(0,0,0,0.5)';
            }
        }

        document.addEventListener("keydown", (e) => {
            let moved = false;
            
            if (e.key === "ArrowLeft") {
                playerX = Math.max(0, playerX - speed);
                corridorX += speed;
                moved = true;
            }
            
            if (e.key === "ArrowRight") {
                playerX = Math.min(game.clientWidth - player.clientWidth, playerX + speed);
                corridorX -= speed;
                totalDistance += speed;
                moved = true;
            }

            if (moved) {
                player.classList.add('walking');
                crow.classList.add('walking');
                
                const distance = playerX - crowX;
                if (Math.abs(distance) > distanceToMaintain) {
                    if (distance > 0) {
                        crowX += crowSpeed;
                    } else {
                        crowX -= crowSpeed;
                    }
                }
                
                crow.style.left = crowX + "px";
                updateDarkness();
                checkEntrance();
            } else {
                player.classList.remove('walking');
                crow.classList.remove('walking');
            }

            // Gestion du défilement infini avec 3 sections
            if (corridorX <= -tileWidth * 2) {
                corridorX += tileWidth;
            } else if (corridorX >= 0) {
                corridorX -= tileWidth;
            }

            player.style.left = playerX + "px";
            corridor.style.transform = `translateX(${corridorX}px)`;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
                player.classList.remove('walking');
                crow.classList.remove('walking');
            }
        });

        // Initialiser la position de la lumière
        updateDarkness();
        checkEntrance();

        document.addEventListener("click", () => document.body.focus());
    </script>
